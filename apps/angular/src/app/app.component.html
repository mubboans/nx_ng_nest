@if (showSidebar) {
  <nz-layout class="full-height-layout min-h-screen">
    <nz-sider nzCollapsible [(nzCollapsed)]="isCollapsed" [nzTrigger]="null" class="border-r-2 border-black">
      <div class="p-4 flex items-center justify-center border-b border-gray-800">
        <span class="text-white font-bold font-mono tracking-wider text-sm">MDX ADMIN CMS</span>
      </div>
      <ul nz-menu nzTheme="dark" nzMode="inline">
        <li nz-menu-item routerLink="/dashboard">
          <nz-icon nzType="dashboard" />
          <span>Dashboard &amp; CMS</span>
        </li>
        <li nz-menu-item routerLink="/home">
          <nz-icon nzType="car" />
          <span>Public Website</span>
        </li>
        <li nz-menu-item routerLink="/models">
          <nz-icon nzType="file" />
          <span>Car Lineup</span>
        </li>
      </ul>
    </nz-sider>
    <nz-layout class="inner-layout bg-[#f1f3f7]">
      <nz-header class="bg-white border-b-2 border-black px-6 flex items-center justify-between shadow-[2px_2px_0px_#000]">
        <div class="flex items-center gap-3">
          <button (click)="isCollapsed = !isCollapsed" class="p-2 border border-black rounded hover:bg-gray-100 cursor-pointer">
            <nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" />
          </button>
          <span class="font-bold uppercase text-sm">MDX MOTORS Management Portal</span>
        </div>
        <div class="flex items-center gap-3">
          <a routerLink="/" class="text-xs uppercase font-bold text-black hover:underline flex items-center gap-1">
            <nz-icon nzType="arrow-left" /> View Live Site
          </a>
        </div>
      </nz-header>
      <nz-content class="main-content p-6">
        <router-outlet></router-outlet>
      </nz-content>
    </nz-layout>
  </nz-layout>
} @else {
  <router-outlet></router-outlet>
}
